<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Comparador de Clubes</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f5f2ea;
    --paper-2: #ece7d9;
    --card: #ffffff;
    --bar: #fbfaf6;
    --border: #ded8c8;
    --border-strong: #c6bda7;
    --ink: #1b1a15;
    --muted: #6e685a;
    --faint: #a39b86;
    --green: #1b7a43;
    --green-dark: #145f33;
    --green-text: #1b7a43;
    --bronze: #9a6a1a;
    --danger: #b3261e;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #131418;
    --paper-2: #1f2026;
    --card: #1b1c22;
    --bar: #16171c;
    --border: #2c2e36;
    --border-strong: #41434d;
    --ink: #ece9e0;
    --muted: #a6a39a;
    --faint: #7c7a72;
    --green: #278a55;
    --green-dark: #1d6b41;
    --green-text: #5ad68f;
    --bronze: #d0a04a;
    --danger: #ff7a70;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 64px;
    -webkit-font-smoothing: antialiased;
  }

  .kicker {
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--faint); font-weight: 600;
  }

  header {
    position: relative;
    text-align: center;
    padding: 42px 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 560;
    font-size: clamp(2rem, 5vw, 3rem);
    letter-spacing: -0.01em;
    margin-top: 10px;
  }
  header h1 em { font-style: italic; color: var(--green-text); }
  header p { color: var(--muted); margin-top: 8px; font-size: 1rem; }

  .theme-control {
    position: absolute;
    top: 18px; right: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .theme-control .moon {
    color: var(--muted);
    display: flex; align-items: center;
    transition: color 0.2s;
  }
  :root[data-theme="dark"] .theme-control .moon { color: var(--green-text); }
  .theme-toggle {
    width: 52px; height: 28px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--paper-2);
    cursor: pointer;
    padding: 3px;
    display: flex;
    align-items: center;
    transition: background 0.2s, border-color 0.2s;
  }
  .theme-toggle .knob {
    display: block; flex: 0 0 auto;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--green);
    transition: transform 0.25s ease, background 0.2s;
  }
  :root[data-theme="dark"] .theme-toggle .knob {
    transform: translateX(24px);
    background: var(--green-text);
  }

  /* Selection bar */
  #selectionBar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    justify-content: center;
    min-height: 58px;
  }
  #selectionBar .hint { color: var(--muted); font-size: 0.9rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 8px 6px 12px;
    font-size: 0.85rem;
    animation: pop 0.25s ease;
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
  .chip button {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 1rem; line-height: 1;
    padding: 2px 5px; border-radius: 50%;
  }
  .chip button:hover { color: var(--danger); background: var(--paper-2); }
  .btn {
    border: 1px solid transparent; cursor: pointer; font-weight: 600;
    border-radius: 8px; padding: 10px 18px; font-size: 0.92rem;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--green); color: #fff;
  }
  .btn.primary:hover { background: var(--green-dark); }
  .btn.ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--border-strong);
  }
  .btn.ghost:hover { border-color: var(--ink); background: var(--card); }

  main { max-width: 1060px; margin: 0 auto; padding: 28px 16px; }

  .section-title { text-align: center; margin: 8px 0 26px; }
  .section-title h2 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 560; font-size: 1.7rem; margin-top: 8px;
  }
  .section-title p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }

  .league-card {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .league-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: 0 6px 18px rgba(30,26,15,0.08); }
  .league-card .flag { font-size: 1.7rem; flex: 0 0 auto; }
  .league-card .lc-body { min-width: 0; }
  .league-card h3 { font-family: "Fraunces", Georgia, serif; font-weight: 560; font-size: 1.05rem; }
  .league-card .count { color: var(--muted); font-size: 0.72rem; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
  .league-card .arrow {
    margin-left: auto; color: var(--faint);
    transition: transform 0.15s, color 0.15s;
  }
  .league-card:hover .arrow { color: var(--green-text); transform: translateX(3px); }

  .club-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; cursor: pointer;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .club-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: 0 6px 18px rgba(30,26,15,0.08); }
  .badge {
    width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700; font-size: 0.95rem; color: #fff;
    background: var(--lc);
    background: color-mix(in srgb, var(--lc) 80%, #101d14 20%);
    letter-spacing: 0.02em;
  }
  img.badge {
    background: #fff;
    object-fit: contain;
    padding: 5px;
    border: 1px solid var(--border);
  }
  .club-card .info { min-width: 0; }
  .club-card .name { font-weight: 600; font-size: 0.98rem; }
  .club-card .meta { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .club-card .add {
    margin-left: auto; width: 30px; height: 30px; flex: 0 0 30px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-strong); border-radius: 50%;
    font-size: 1.05rem; color: var(--muted);
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .club-card:hover .add { color: var(--green-text); border-color: var(--green-text); }
  .club-card.selected { border-color: var(--green); }
  .club-card.selected .add { color: #fff; background: var(--green); border-color: var(--green); }

  .back-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .back-row h2 { font-family: "Fraunces", Georgia, serif; font-weight: 560; font-size: 1.4rem; }
  .back-btn {
    background: transparent; border: 1px solid var(--border-strong); color: var(--ink);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 0.88rem;
  }
  .back-btn:hover { border-color: var(--ink); background: var(--card); }

  /* Comparison */
  .podium {
    display: flex; justify-content: center; align-items: flex-start; gap: 12px;
    margin: 26px 0 8px; flex-wrap: wrap;
  }
  .podium .step {
    text-align: center; min-width: 130px; padding: 16px 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  }
  .podium .step.winner { border-color: var(--green); }
  .podium .badge { margin: 0 auto 10px; width: 54px; height: 54px; font-size: 1.05rem; border-radius: 11px; }
  .podium .pos { font-size: 0.7rem; color: var(--faint); letter-spacing: 0.14em; text-transform: uppercase; }
  .podium .pos.winner { color: var(--green-text); }
  .podium .name { font-weight: 600; font-size: 0.92rem; margin: 6px 0 2px; }
  .podium .pct { font-family: "Fraunces", Georgia, serif; font-size: 1.5rem; font-weight: 600; color: var(--green-text); }
  .podium .rating { font-size: 0.78rem; color: var(--muted); margin: 2px 0 6px; }

  .bars { margin: 26px 0; display: flex; flex-direction: column; gap: 14px; }
  .bar-row { }
  .bar-row .top { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
  .bar-row .top .pct { font-weight: 800; }
  .bar-track { height: 12px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 999px;
    background: var(--lc);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .why-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: 12px; padding: 22px;
  }
  .why-box h3 { font-family: "Fraunces", Georgia, serif; font-weight: 560; margin-bottom: 12px; }
  .why-box .verdict { font-size: 1.05rem; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
  .why-box ul { list-style: none; }
  .why-box li { margin: 8px 0; line-height: 1.55; color: var(--muted); padding-left: 18px; position: relative; }
  .why-box li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--bronze); }

  .compare-actions { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #221f18; color: #f7f4ec;
    padding: 12px 20px; border-radius: 10px; font-size: 0.92rem;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
    box-shadow: 0 10px 24px rgba(0,0,0,0.22); z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Análise do duelo */
  .duel-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px; margin: 10px 0 22px;
  }
  .duel-box h3 { text-align: center; margin-bottom: 16px; font-family: "Fraunces", Georgia, serif; font-weight: 560; }
  .duel-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .duel-head .team { font-weight: 600; }
  .duel-head .vs { color: var(--faint); font-weight: 700; letter-spacing: 2px; font-size: 0.8rem; text-transform: uppercase; }
  .pillar-row { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 12px; align-items: center; margin: 9px 0; }
  .pillar-label { color: var(--muted); font-size: 0.85rem; }
  .pillar-val { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .pillar-val b { font-size: 0.9rem; color: var(--ink); min-width: 24px; font-weight: 600; }
  .pillar-val.best b { color: var(--green-text); }
  .mini-bar { flex: 1; height: 8px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
  .mini-fill { height: 100%; background: var(--lc); border-radius: 999px; }
  @media (max-width: 560px) {
    .pillar-row { grid-template-columns: 84px 1fr 1fr; gap: 8px; }
    .mini-bar { display: none; }
  }

  footer { text-align: center; color: var(--faint); font-size: 0.78rem; margin-top: 48px; }
</style>
</head>

// Prefixos comuns ignorados ao gerar as iniciais do escudo
const STOP_WORDS = new Set([
  'fc', 'cf', 'ac', 'sc', 'cd', 'sd', 'ec', 'rc', 'rcd', 'sad', 'cp',
  'de', 'la', 'el', 'da', 'do', 'dos', 'das', 'club', 'futebol', 'football', '1'
]);

function initials(nome) {
  const words = nome.split(/[\s\-]+/)
    .map(w => w.replace(/[.'’]/g, ''))
    .filter(w => w && !STOP_WORDS.has(w.toLowerCase()));
  if (words.length === 0) return nome.slice(0, 2).toUpperCase();
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

// Renderiza primeiro o escudo de iniciais; o hydrateLogos troca-o pelo logótipo real.
function badgeHTML(nome, cor) {
  return `<span class="badge badge-crest" style="--lc:${cor}" data-name="${nome}">${initials(nome)}</span>`;
}

function setBadgeImage(el, src) {
  const img = document.createElement('img');
  img.className = 'badge';
  img.src = src;
  img.alt = '';
  img.loading = 'lazy';
  img.onerror = () => img.replaceWith(el);
  el.replaceWith(img);
}

function hydrateLogos() {
  // 1) Logótipos do CDN (ligas europeias)
  document.querySelectorAll('.badge-crest').forEach(el => {
    const url = logoUrl(el.dataset.name);
    if (url) setBadgeImage(el, url);
  });
  // 2) Logótipos da Wikipédia (restantes ligas)
  resolveWikiLogos();
}

async function resolveWikiLogos() {
  const els = [...document.querySelectorAll('.badge-crest')]
    .filter(el => WIKI_TITLES[el.dataset.name]);
  if (!els.length) return;

  const nameToEl = new Map();
  const titleToName = {};
  els.forEach(el => {
    if (!nameToEl.has(el.dataset.name)) {
      nameToEl.set(el.dataset.name, el);
      titleToName[WIKI_TITLES[el.dataset.name]] = el.dataset.name;
    }
  });
  const titles = Object.keys(titleToName);

  for (let i = 0; i < titles.length; i += 40) {
    const chunk = titles.slice(i, i + 40).join('|');
    try {
      const res = await fetch(
        `https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&prop=pageimages&piprop=thumbnail&pithumbsize=160&pilicense=any&redirects=1&origin=*&titles=${encodeURIComponent(chunk)}`
      );
      const data = await res.json();
      const redirects = {};
      ((data.query && data.query.redirects) || []).forEach(rd => { redirects[rd.from] = rd.to; });
      for (const page of (data.query && data.query.pages) || []) {
        if (!page.thumbnail) continue;
        let name = titleToName[page.title];
        if (!name) {
          const from = Object.keys(redirects).find(k => redirects[k] === page.title);
          if (from) name = titleToName[from];
        }
        if (name && nameToEl.has(name)) setBadgeImage(nameToEl.get(name), page.thumbnail.source);
      }
    } catch (e) { /* offline ou bloqueado: mantém o escudo */ }
  }
}

function findByClubName(nome) {
  for (const lg of LEAGUES) {
    const club = lg.clubs.find(c => c.nome === nome);
    if (club) return { league: lg, club };
  }
  return null;
}

// ---- Algoritmo de avaliação ----
// Hash determinístico (FNV-1a) para gerar atributos estáveis por clube
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// Jitter determinístico entre -range e +range, baseado no nome + sal
function jitter(nome, sal, range) {
  return ((hash(nome + ':' + sal) % (range * 200 + 1)) / 100) - range;
}

// Forma do dia (muda diariamente, mas é estável dentro do mesmo dia)
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

const PILLARS = [
  { key: 'ataque',    label: 'Ataque' },
  { key: 'defesa',    label: 'Defesa' },
  { key: 'meioCampo', label: 'Meio-campo' },
  { key: 'historia',  label: 'História' },
  { key: 'torcida',   label: 'Torcida' },
  { key: 'forma',     label: 'Forma atual' },
];

// Avaliação multi-dimensional de um clube
function evaluate(club) {
  const n = club.nome;
  const ataque    = clamp(Math.round(club.p * 0.96 + jitter(n, 'atk', 10)), 40, 99);
  const defesa    = clamp(Math.round(club.p * 0.96 + jitter(n, 'def', 10)), 40, 99);
  const meioCampo = clamp(Math.round(club.p * 0.94 + jitter(n, 'mid', 10)), 40, 99);
  const historia  = clamp(Math.round(30 + club.t * 2.2 + jitter(n, 'his', 4)), 20, 99);
  const torcida   = clamp(Math.round(club.p * 0.92 + jitter(n, 'tor', 12)), 35, 99);
  const forma     = clamp(Math.round(club.p * 0.90 + jitter(n + todayKey(), 'frm', 14)), 30, 99);
  const rating =
    ataque * 0.18 + defesa * 0.18 + meioCampo * 0.14 +
    historia * 0.22 + torcida * 0.18 + forma * 0.10;
  return { ataque, defesa, meioCampo, historia, torcida, forma, rating };
}

// ---- Barra de seleção ----
function renderBar() {
  if (selection.length === 0) {
    barEl.innerHTML = '<span class="hint">Adiciona 2 ou mais clubes para comparares.</span>';
    return;
  }
  const chips = selection.map((nome, i) => {
    const { league } = findByClubName(nome);
    return `<span class="chip">${league.bandeira} ${nome}
      <button title="Remover" onclick="removeClub(${i})">✕</button></span>`;
  }).join('');
  const compareBtn = selection.length >= 2
    ? '<button class="btn primary" onclick="renderComparison()">Comparar</button>'
    : '';
  const clearBtn = '<button class="btn ghost" onclick="clearSelection()">Limpar</button>';
  barEl.innerHTML = chips + compareBtn + clearBtn;
}

function removeClub(i) {
  selection.splice(i, 1);
  renderBar();
  if (currentLeague) renderClubs(currentLeague);
}

function clearSelection() {
  selection = [];
  renderBar();
  renderLeagues();
}

// ---- Ecrã: menu de ligas ----
function renderLeagues() {
  currentLeague = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  app.innerHTML = `
    <div class="section-title">
      <div class="kicker">Ligas</div>
      <h2>Escolhe uma liga</h2>
      <p>Clica numa liga para veres todos os clubes.</p>
    </div>
    <div class="grid">
      ${LEAGUES.map(lg => `
        <div class="league-card" style="--lc:${lg.cor}" onclick="renderClubs('${lg.id}')">
          <span class="flag">${lg.bandeira}</span>
          <div class="lc-body">
            <h3>${lg.nome}</h3>
            <div class="count">${lg.clubs.length} clubes</div>
          </div>
          <span class="arrow">→</span>
        </div>`).join('')}
    </div>
    ${selection.length >= 2 ? `<div class="compare-actions">
      <button class="btn primary" onclick="renderComparison()">Comparar ${selection.length} clubes</button>
    </div>` : ''}
  `;
}

// ---- Ecrã: clubes de uma liga ----
function renderClubs(id) {
  const lg = LEAGUES.find(l => l.id === id);
  if (!lg) return;
  currentLeague = id;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  app.innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="renderLeagues()">← Voltar</button>
      <h2>${lg.bandeira} ${lg.nome}</h2>
    </div>
    <div class="grid">
      ${lg.clubs.map(c => {
        const sel = selection.includes(c.nome);
        return `
          <div class="club-card ${sel ? 'selected' : ''}" style="--lc:${lg.cor}" onclick="addClub('${lg.id}','${c.nome}')">
            ${badgeHTML(c.nome, lg.cor)}
            <div class="info">
              <div class="name">${c.nome}</div>
              <div class="meta">${c.t > 0 ? c.t + ' títulos' : 'Sem títulos'} · Rating ${Math.round(evaluate(c).rating)}</div>
            </div>
            <div class="add">${sel ? '✓' : '+'}</div>
          </div>`;
      }).join('')}
    </div>
  `;
  hydrateLogos();
}

// ---- Adicionar clube ----
function addClub(leagueId, nome) {
  if (selection.includes(nome)) {
    toast(nome + ' já está na seleção.');
    return;
  }
  if (selection.length >= 6) {
    toast('Máximo de 6 clubes por comparação.');
    return;
  }
  selection.push(nome);
  renderBar();
  toast(nome + ' adicionado.');
  renderLeagues(); // volta ao menu das ligas
}

// ---- Comparação ----
function renderComparison() {
  if (selection.length < 2) {
    toast('Seleciona pelo menos 2 clubes.');
    return;
  }
  currentLeague = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const clubs = selection.map(nome => findByClubName(nome)).filter(Boolean)
    .map(x => ({ ...x, ev: evaluate(x.club) }));
  const total = clubs.reduce((s, x) => s + x.ev.rating, 0);
  const sorted = [...clubs].sort((a, b) => b.ev.rating - a.ev.rating);
  const pct = x => (x.ev.rating / total) * 100;

  const winner = sorted[0];
  const runner = sorted[1];
  const diff = pct(winner) - pct(runner);

  // Categorias em que o vencedor supera o 2º classificado
  const wins = PILLARS.filter(p => winner.ev[p.key] > runner.ev[p.key]);
  const bestPillar = PILLARS.reduce((best, p) => {
    const d = winner.ev[p.key] - runner.ev[p.key];
    return d > best.d ? { key: p.key, label: p.label, d } : best;
  }, { key: '', label: '', d: -Infinity });

  const why = [];
  why.push(`Vence em ${wins.length} de ${PILLARS.length} categorias sobre ${runner.club.nome}.`);
  why.push(`Ponto mais forte: ${bestPillar.label.toLowerCase()} — ${winner.ev[bestPillar.key]} contra ${runner.ev[bestPillar.key]}.`);
  if (winner.club.tag) why.push(winner.club.tag);
  why.push(`Supera ${runner.club.nome} em ${diff.toFixed(1)} pontos percentuais.`);
  if (winner.club.t > 0) {
    why.push(`Os seus ${winner.club.t} títulos nacionais pesam no pilar da história.`);
  } else {
    why.push(`Mesmo sem uma sala de troféus gigante, o futebol atual domina.`);
  }

  const duelRows = PILLARS.map(p => {
    const w = winner.ev[p.key];
    const r = runner.ev[p.key];
    return `
        <div class="pillar-row">
          <span class="pillar-label">${p.label}</span>
          <span class="pillar-val ${w >= r ? 'best' : ''}">
            <b>${w}</b>
            <span class="mini-bar"><span class="mini-fill" style="--lc:${winner.league.cor}; width:${w}%"></span></span>
          </span>
          <span class="pillar-val ${r > w ? 'best' : ''}">
            <b>${r}</b>
            <span class="mini-bar"><span class="mini-fill" style="--lc:${runner.league.cor}; width:${r}%"></span></span>
          </span>
        </div>`;
  }).join('');

  app.innerHTML = `
    <div class="section-title">
      <div class="kicker">Resultado</div>
      <h2>Ranking da comparação</h2>
      <p>${clubs.length} clubes em duelo, ordenados por rating.</p>
    </div>

    <div class="podium">
      ${sorted.map((x, i) => {
        const medal = `${i + 1}º`;
        return `
          <div class="step ${i === 0 ? 'winner' : ''}">
            ${i === 0 ? '<div class="pos winner">Vencedor</div>' : `<div class="pos">${medal}</div>`}
            ${badgeHTML(x.club.nome, x.league.cor)}
            <div class="name">${x.league.bandeira} ${x.club.nome}</div>
            <div class="rating">Rating ${Math.round(x.ev.rating)}</div>
            <div class="pct">${pct(x).toFixed(1)}%</div>
          </div>`;
      }).join('')}
    </div>

    <div class="bars">
      ${sorted.map(x => `
        <div class="bar-row">
          <div class="top">
            <span>${x.league.bandeira} ${x.club.nome}</span>
            <span class="pct">${pct(x).toFixed(1)}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="--lc:${x.league.cor}; width:0%" data-w="${pct(x).toFixed(1)}"></div>
          </div>
        </div>`).join('')}
    </div>

    <div class="duel-box">
      <h3>Duelo decisivo</h3>
      <div class="duel-head">
        <span class="team">${winner.league.bandeira} ${winner.club.nome}</span>
        <span class="vs">VS</span>
        <span class="team">${runner.league.bandeira} ${runner.club.nome}</span>
      </div>
      ${duelRows}
    </div>

    <div class="why-box">
      <h3>Veredicto</h3>
      <p class="verdict">${winner.club.nome} é o melhor clube, com ${pct(winner).toFixed(1)}% do poder total.</p>
      <ul>${why.map(line => `<li>${line}</li>`).join('')}</ul>
    </div>

    <div class="compare-actions">
      <button class="btn ghost" onclick="renderLeagues()">← Adicionar mais clubes</button>
      <button class="btn ghost" onclick="clearSelection()">Nova comparação</button>
    </div>
  `;

  // Animar as barras
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  });

  hydrateLogos();
}

// ---- Tema (claro por omissão) ----
function toggleTheme() {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
}

// ---- Arranque ----
(function initTheme() {
  let theme = 'light';
  try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') theme = 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();

renderBar();
renderLeagues();
</script>

<footer>Avaliação lúdica baseada em ataque, defesa, meio-campo, história, torcida e forma atual.</footer>
</body>
