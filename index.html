<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Comparador de Clubes</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #101830;
    --card: rgba(255, 255, 255, 0.05);
    --card-hover: rgba(255, 255, 255, 0.10);
    --border: rgba(255, 255, 255, 0.12);
    --text: #eef2ff;
    --muted: #9aa4c7;
    --gold: #ffd54a;
    --accent: #4f8cff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(79, 140, 255, 0.25), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(255, 213, 74, 0.12), transparent 55%),
      linear-gradient(160deg, var(--bg), var(--bg2));
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    text-align: center;
    padding: 34px 20px 10px;
  }
  header h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: 0.5px; }
  header h1 .ball { display: inline-block; animation: bounce 1.6s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  header p { color: var(--muted); margin-top: 8px; font-size: 1rem; }

  /* Selection bar */
  #selectionBar {
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
    background: rgba(10, 14, 26, 0.85);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    justify-content: center;
    min-height: 58px;
  }
  #selectionBar .hint { color: var(--muted); font-size: 0.9rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 8px 6px 12px;
    font-size: 0.85rem;
    animation: pop 0.25s ease;
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
  .chip button {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 1rem; line-height: 1;
    padding: 2px 5px; border-radius: 50%;
  }
  .chip button:hover { color: #ff6b6b; background: rgba(255,255,255,0.1); }
  .btn {
    border: none; cursor: pointer; font-weight: 700;
    border-radius: 10px; padding: 10px 18px; font-size: 0.95rem;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn.compare {
    background: linear-gradient(135deg, #ffd54a, #ff9d2e);
    color: #2b1a00;
    box-shadow: 0 6px 20px rgba(255, 157, 46, 0.35);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 6px 20px rgba(255,157,46,0.35);} 50% { box-shadow: 0 6px 30px rgba(255,157,46,0.7);} }
  .btn.ghost {
    background: var(--card); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.ghost:hover { background: var(--card-hover); }

  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px; }

  .section-title { text-align: center; margin: 12px 0 22px; }
  .section-title h2 { font-size: 1.5rem; }
  .section-title p { color: var(--muted); margin-top: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }

  .league-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 18px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s ease, background 0.2s, border-color 0.2s;
    overflow: hidden;
  }
  .league-card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(220px 120px at 50% -20%, var(--lc), transparent 70%);
    opacity: 0.5; transition: opacity 0.2s;
  }
  .league-card:hover { transform: translateY(-4px); background: var(--card-hover); border-color: var(--lc); }
  .league-card:hover::before { opacity: 0.9; }
  .league-card .flag { font-size: 2.6rem; }
  .league-card h3 { margin-top: 8px; font-size: 1.1rem; position: relative; }
  .league-card .count { color: var(--muted); font-size: 0.82rem; margin-top: 4px; position: relative; }
  .league-card .arrow {
    position: absolute; right: 12px; top: 12px; color: var(--muted);
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
  }
  .league-card:hover .arrow { opacity: 1; transform: translateX(3px); }

  .club-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; cursor: pointer;
    transition: transform 0.15s ease, background 0.2s, border-color 0.2s;
  }
  .club-card:hover { transform: translateY(-3px); background: var(--card-hover); border-color: var(--lc); }
  .badge {
    width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.95rem; color: #fff;
    background: linear-gradient(135deg, var(--lc), #222);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.35);
  }
  .club-card .info { min-width: 0; }
  .club-card .name { font-weight: 700; font-size: 0.98rem; }
  .club-card .meta { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  .club-card .add {
    margin-left: auto; font-size: 1.2rem; color: var(--muted);
    transition: color 0.2s, transform 0.2s;
  }
  .club-card:hover .add { color: var(--gold); transform: scale(1.2); }
  .club-card.selected { border-color: var(--gold); background: rgba(255,213,74,0.08); }
  .club-card.selected .add { color: var(--gold); }

  .back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .back-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 0.9rem;
  }
  .back-btn:hover { background: var(--card-hover); }

  /* Comparison */
  .podium {
    display: flex; justify-content: center; align-items: flex-end; gap: 12px;
    margin: 26px 0 8px; flex-wrap: wrap;
  }
  .podium .step { text-align: center; }
  .podium .badge { margin: 0 auto 8px; width: 56px; height: 56px; font-size: 1.1rem; }
  .podium .pos { font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; }
  .podium .name { font-weight: 700; font-size: 0.95rem; margin: 4px 0 2px; }
  .podium .pct { font-size: 1.3rem; font-weight: 800; color: var(--gold); }
  .winner-crown { font-size: 1.5rem; }

  .bars { margin: 26px 0; display: flex; flex-direction: column; gap: 14px; }
  .bar-row { }
  .bar-row .top { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
  .bar-row .top .pct { font-weight: 800; }
  .bar-track { height: 14px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--lc), #fff);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .why-box {
    background: linear-gradient(135deg, rgba(255,213,74,0.12), rgba(255,157,46,0.06));
    border: 1px solid rgba(255,213,74,0.4);
    border-radius: 16px; padding: 20px;
  }
  .why-box h3 { color: var(--gold); margin-bottom: 12px; }
  .why-box p { margin: 6px 0; line-height: 1.5; }

  .compare-actions { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1b2440; border: 1px solid var(--border); color: var(--text);
    padding: 12px 20px; border-radius: 12px; font-size: 0.92rem;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Análise do duelo */
  .duel-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin: 10px 0 22px;
  }
  .duel-box h3 { text-align: center; margin-bottom: 14px; }
  .duel-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .duel-head .team { font-weight: 700; }
  .duel-head .vs { color: var(--muted); font-weight: 800; letter-spacing: 1px; }
  .pillar-row { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 12px; align-items: center; margin: 9px 0; }
  .pillar-label { color: var(--muted); font-size: 0.85rem; }
  .pillar-val { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .pillar-val b { font-size: 0.9rem; color: var(--text); min-width: 24px; }
  .pillar-val.best b { color: var(--gold); }
  .mini-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
  .mini-fill { height: 100%; background: linear-gradient(90deg, var(--lc), #fff); border-radius: 999px; }
  .podium .rating { font-size: 0.78rem; color: var(--muted); margin: 2px 0; }
  @media (max-width: 560px) {
    .pillar-row { grid-template-columns: 84px 1fr 1fr; gap: 8px; }
    .mini-bar { display: none; }
  }

  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 40px; }
</style>
</head>

// ---- Estado ----
let selection = [];
let currentLeague = null;

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
const barEl = document.getElementById('selectionBar');

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

// Prefixos comuns ignorados ao gerar as iniciais do escudo
const STOP_WORDS = new Set([
  'fc', 'cf', 'ac', 'sc', 'cd', 'sd', 'ec', 'rc', 'rcd', 'sad', 'cp',
  'de', 'la', 'el', 'da', 'do', 'dos', 'das', 'club', 'futebol', 'football', '1'
]);

function initials(nome) {
  const words = nome.split(/[\s\-]+/)
    .map(w => w.replace(/[.'’]/g, ''))
    .filter(w => w && !STOP_WORDS.has(w.toLowerCase()));
  if (words.length === 0) return nome.slice(0, 2).toUpperCase();
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

function findByClubName(nome) {
  for (const lg of LEAGUES) {
    const club = lg.clubs.find(c => c.nome === nome);
    if (club) return { league: lg, club };
  }
  return null;
}

// ---- Algoritmo de avaliação ----
// Hash determinístico (FNV-1a) para gerar atributos estáveis por clube
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// Jitter determinístico entre -range e +range, baseado no nome + sal
function jitter(nome, sal, range) {
  return ((hash(nome + ':' + sal) % (range * 200 + 1)) / 100) - range;
}

// Forma do dia (muda diariamente, mas é estável dentro do mesmo dia)
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

const PILLARS = [
  { key: 'ataque',    label: 'Ataque' },
  { key: 'defesa',    label: 'Defesa' },
  { key: 'meioCampo', label: 'Meio-campo' },
  { key: 'historia',  label: 'História' },
  { key: 'torcida',   label: 'Torcida' },
  { key: 'forma',     label: 'Forma atual' },
];

// Avaliação multi-dimensional de um clube
function evaluate(club) {
  const n = club.nome;
  const ataque    = clamp(Math.round(club.p * 0.96 + jitter(n, 'atk', 10)), 40, 99);
  const defesa    = clamp(Math.round(club.p * 0.96 + jitter(n, 'def', 10)), 40, 99);
  const meioCampo = clamp(Math.round(club.p * 0.94 + jitter(n, 'mid', 10)), 40, 99);
  const historia  = clamp(Math.round(30 + club.t * 2.2 + jitter(n, 'his', 4)), 20, 99);
  const torcida   = clamp(Math.round(club.p * 0.92 + jitter(n, 'tor', 12)), 35, 99);
  const forma     = clamp(Math.round(club.p * 0.90 + jitter(n + todayKey(), 'frm', 14)), 30, 99);
  const rating =
    ataque * 0.18 + defesa * 0.18 + meioCampo * 0.14 +
    historia * 0.22 + torcida * 0.18 + forma * 0.10;
  return { ataque, defesa, meioCampo, historia, torcida, forma, rating };
}

// ---- Barra de seleção ----
function renderBar() {
  if (selection.length === 0) {
    barEl.innerHTML = '<span class="hint">Seleciona pelo menos 2 clubes para comparares.</span>';
    return;
  }
  const chips = selection.map((nome, i) => {
    const { league } = findByClubName(nome);
    return `<span class="chip">${league.bandeira} ${nome}
      <button title="Remover" onclick="removeClub(${i})">✕</button></span>`;
  }).join('');
  const compareBtn = selection.length >= 2
    ? '<button class="btn compare" onclick="renderComparison()">⚔️ Comparar agora</button>'
    : '';
  const clearBtn = '<button class="btn ghost" onclick="clearSelection()">Limpar</button>';
  barEl.innerHTML = chips + compareBtn + clearBtn;
}

function removeClub(i) {
  selection.splice(i, 1);
  renderBar();
  if (currentLeague) renderClubs(currentLeague);
}

function clearSelection() {
  selection = [];
  renderBar();
  renderLeagues();
}

// ---- Ecrã: menu de ligas ----
function renderLeagues() {
  currentLeague = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  app.innerHTML = `
    <div class="section-title">
      <h2>🌍 Escolhe uma Liga</h2>
      <p>Clica numa liga para veres todos os clubes.</p>
    </div>
    <div class="grid">
      ${LEAGUES.map(lg => `
        <div class="league-card" style="--lc:${lg.cor}" onclick="renderClubs('${lg.id}')">
          <span class="arrow">→</span>
          <div class="flag">${lg.bandeira}</div>
          <h3>${lg.nome}</h3>
          <div class="count">${lg.clubs.length} clubes</div>
        </div>`).join('')}
    </div>
    ${selection.length >= 2 ? `<div class="compare-actions">
      <button class="btn compare" onclick="renderComparison()">⚔️ Comparar os ${selection.length} clubes</button>
    </div>` : ''}
  `;
}

// ---- Ecrã: clubes de uma liga ----
function renderClubs(id) {
  const lg = LEAGUES.find(l => l.id === id);
  if (!lg) return;
  currentLeague = id;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  app.innerHTML = `
    <div class="back-row">
      <button class="back-btn" onclick="renderLeagues()">← Voltar ao menu</button>
      <h2 style="font-size:1.3rem">${lg.bandeira} ${lg.nome}</h2>
    </div>
    <div class="grid">
      ${lg.clubs.map(c => {
        const sel = selection.includes(c.nome);
        return `
          <div class="club-card ${sel ? 'selected' : ''}" style="--lc:${lg.cor}" onclick="addClub('${lg.id}','${c.nome}')">
            <div class="badge">${initials(c.nome)}</div>
            <div class="info">
              <div class="name">${c.nome}</div>
              <div class="meta">${c.t > 0 ? '🏅 ' + c.t + ' títulos' : 'Competidor'} · ★ ${Math.round(evaluate(c).rating)}</div>
            </div>
            <div class="add">${sel ? '✅' : '+'}</div>
          </div>`;
      }).join('')}
    </div>
  `;
}

// ---- Adicionar clube ----
function addClub(leagueId, nome) {
  if (selection.includes(nome)) {
    toast('⚠️ ' + nome + ' já está na seleção');
    return;
  }
  if (selection.length >= 6) {
    toast('⚠️ Máximo de 6 clubes por comparação');
    return;
  }
  selection.push(nome);
  renderBar();
  toast('✅ ' + nome + ' adicionado!');
  renderLeagues(); // volta ao menu das ligas
}

// ---- Comparação ----
function renderComparison() {
  if (selection.length < 2) {
    toast('Seleciona pelo menos 2 clubes');
    return;
  }
  currentLeague = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const clubs = selection.map(nome => findByClubName(nome)).filter(Boolean)
    .map(x => ({ ...x, ev: evaluate(x.club) }));
  const total = clubs.reduce((s, x) => s + x.ev.rating, 0);
  const sorted = [...clubs].sort((a, b) => b.ev.rating - a.ev.rating);
  const pct = x => (x.ev.rating / total) * 100;

  const winner = sorted[0];
  const runner = sorted[1];
  const diff = pct(winner) - pct(runner);

  // Categorias em que o vencedor supera o 2º classificado
  const wins = PILLARS.filter(p => winner.ev[p.key] > runner.ev[p.key]);
  const bestPillar = PILLARS.reduce((best, p) => {
    const d = winner.ev[p.key] - runner.ev[p.key];
    return d > best.d ? { key: p.key, label: p.label, d } : best;
  }, { key: '', label: '', d: -Infinity });

  const why = [];
  why.push(`🏆 <b>${winner.club.nome}</b> é o melhor clube desta comparação com <b>${pct(winner).toFixed(1)}%</b> do poder total.`);
  why.push(`🔬 Vence em <b>${wins.length} de ${PILLARS.length}</b> categorias sobre ${runner.club.nome}.`);
  why.push(`📈 O seu ponto mais forte é <b>${bestPillar.label.toLowerCase()}</b>: ${winner.ev[bestPillar.key]} contra ${runner.ev[bestPillar.key]} do rival.`);
  if (winner.club.tag) why.push(`💬 ${winner.club.tag}`);
  why.push(`📊 Supera ${runner.club.nome} em <b>${diff.toFixed(1)} pontos percentuais</b>.`);
  if (winner.club.t > 0) {
    why.push(`🏅 Os seus ${winner.club.t} títulos nacionais pesam no pilar da história.`);
  } else {
    why.push(`🔥 Mesmo sem uma sala de troféus gigante, o seu futebol atual domina.`);
  }

  const duelRows = PILLARS.map(p => {
    const w = winner.ev[p.key];
    const r = runner.ev[p.key];
    return `
        <div class="pillar-row">
          <span class="pillar-label">${p.label}</span>
          <span class="pillar-val ${w >= r ? 'best' : ''}">
            <b>${w}</b>
            <span class="mini-bar"><span class="mini-fill" style="--lc:${winner.league.cor}; width:${w}%"></span></span>
          </span>
          <span class="pillar-val ${r > w ? 'best' : ''}">
            <b>${r}</b>
            <span class="mini-bar"><span class="mini-fill" style="--lc:${runner.league.cor}; width:${r}%"></span></span>
          </span>
        </div>`;
  }).join('');

  app.innerHTML = `
    <div class="section-title">
      <h2>⚔️ Resultado da Comparação</h2>
      <p>${clubs.length} clubes em duelo — aqui está o ranking.</p>
    </div>

    <div class="podium">
      ${sorted.map((x, i) => {
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}º`;
        return `
          <div class="step">
            ${i === 0 ? '<div class="winner-crown">👑</div>' : ''}
            <div class="badge" style="--lc:${x.league.cor}">${initials(x.club.nome)}</div>
            <div class="pos">${medal}</div>
            <div class="name">${x.league.bandeira} ${x.club.nome}</div>
            <div class="rating">⭐ ${Math.round(x.ev.rating)}</div>
            <div class="pct">${pct(x).toFixed(1)}%</div>
          </div>`;
      }).join('')}
    </div>

    <div class="bars">
      ${sorted.map(x => `
        <div class="bar-row">
          <div class="top">
            <span>${x.league.bandeira} ${x.club.nome}</span>
            <span class="pct">${pct(x).toFixed(1)}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="--lc:${x.league.cor}; width:0%" data-w="${pct(x).toFixed(1)}"></div>
          </div>
        </div>`).join('')}
    </div>

    <div class="duel-box">
      <h3>🔬 Análise do duelo decisivo</h3>
      <div class="duel-head">
        <span class="team">${winner.league.bandeira} ${winner.club.nome}</span>
        <span class="vs">VS</span>
        <span class="team">${runner.league.bandeira} ${runner.club.nome}</span>
      </div>
      ${duelRows}
    </div>

    <div class="why-box">
      <h3>🤔 Porquê é que ${winner.club.nome} é o melhor?</h3>
      ${why.map(line => `<p>${line}</p>`).join('')}
    </div>

    <div class="compare-actions">
      <button class="btn ghost" onclick="renderLeagues()">← Adicionar mais clubes</button>
      <button class="btn ghost" onclick="clearSelection()">🔄 Nova comparação</button>
    </div>
  `;

  // Animar as barras
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  });
}

// ---- Arranque ----
renderBar();
renderLeagues();
</script>
